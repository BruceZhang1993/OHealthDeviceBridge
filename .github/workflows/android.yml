name: Android CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Xposed entry is packaged
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/xposed_init|META-INF/yukihookapi_init'
      - uses: actions/upload-artifact@v4
        with:
          name: OHealthDeviceBridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
