name: Android CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
  workflow_call:
    outputs:
      artifact-id:
        description: Signed release APK artifact ID
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve app version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin master
          if [ "$REF_TYPE" = tag ]; then
            VERSION_NAME="${REF_NAME#v}"
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Release tag must be [v]MAJOR.MINOR.PATCH[-prerelease]'
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/master
            VERSION_CODE=$(git rev-list --count HEAD)
          else
            VERSION_NAME="0.1.0-ci.$(git rev-parse --short HEAD)"
            VERSION_CODE=$(git rev-list --count origin/master)
          fi
          echo "ORG_GRADLE_PROJECT_versionName=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_versionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=OHealthDeviceBridge-$VERSION_NAME.apk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unit tests and release APK
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Sign and verify release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Missing required Actions secret: $NAME"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/$APK_NAME"
      - name: Verify modern Xposed metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ "$EVENT_NAME" != pull_request ]; then
            APK="dist/$APK_NAME"
          fi
          unzip -l "$APK" | grep -F 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -F 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -F 'META-INF/xposed/scope.list'
          test "$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')" = 'io.github.brucezhang1993.ohealthdevicebridge.HookEntry'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'minApiVersion=101'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=101'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'staticScope=true'
          test "$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')" = 'com.heytap.health'
          if unzip -l "$APK" | grep -q 'assets/xposed_init'; then
            echo 'Legacy assets/xposed_init must not be packaged'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        id: upload
        if: github.event_name != 'pull_request'
        with:
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          archive: false
